name: Daily Creative Radar Email

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Send daily email
        env:
          # 这是一个专门的"发送邮件"工作流，默认启用；实际是否发送仍取决于 SMTP 密钥是否存在
          EMAIL_ENABLED: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          # SMTP_PORT 是 int 类型；密钥缺失时回退到默认 465，避免 pydantic 解析空串报错
          SMTP_PORT: ${{ secrets.SMTP_PORT || 465 }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          # 从仓库根目录运行，使 backend.app.* 绝对导入与相对导入都能解析
          python -m backend.app.scheduler.daily
